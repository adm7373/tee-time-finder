name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

# Every run uploads the whole frontend directory, so a newer commit supersedes an
# older upload. Let a run finish rather than cancelling one mid-upload and
# leaving the alias pointing at a half-built deployment.
concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # A syntax error in the proxy would otherwise only show up as 500s once the
      # deployment is live.
      - name: Check the Pages Function parses
        run: node --check 'frontend/functions/[[path]].js'

      # --branch main makes this a production deployment, which is what owns the
      # tee-time-finder.pages.dev alias. Without it, a detached CI checkout can
      # be treated as a preview and the alias keeps serving the old build.
      - name: Deploy frontend
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy --branch main

      # The deploy command succeeding only means the upload was accepted. This
      # fetches a path Pages serves itself, so it proves the alias points at this
      # deployment without depending on the API being up.
      - name: Confirm the production alias serves the deployment
        run: |
          for attempt in $(seq 1 6); do
            if curl -fsS https://tee-time-finder.pages.dev/robots.txt >/dev/null; then
              echo "tee-time-finder.pages.dev is serving the deployment"
              exit 0
            fi
            echo "attempt $attempt: alias not serving yet, retrying in 10s"
            sleep 10
          done
          echo "tee-time-finder.pages.dev did not answer after the deploy" >&2
          exit 1
