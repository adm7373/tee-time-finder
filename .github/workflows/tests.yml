name: Tests

on:
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Lambda runtime runs; 3.13 catches anything that
        # depended on 3.12 behaviour by accident.
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        # No AWS credentials and no network: every test that would reach out is
        # stubbed or faked. If that ever stops being true, this job fails
        # loudly rather than silently depending on the internet.
        run: python -m pytest -q --durations=10
