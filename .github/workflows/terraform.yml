name: Terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Pull requests can only look, never change anything: they assume a
      # read-only role if one is configured, and fall back to validate-only when
      # it is not. A PR cannot use the deploy role, so the worst a bad PR can do
      # is show a wrong plan.
      - name: Configure AWS credentials
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && secrets.AWS_PLAN_ROLE_ARN != '')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ github.event_name == 'push' && secrets.AWS_ROLE_ARN || secrets.AWS_PLAN_ROLE_ARN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Build Lambda package
        run: |
          python3 -m pip install --upgrade pip
          # Runtime dependencies only: requirements-dev.txt adds pytest and
          # httpx, which have no place in the Lambda package.
          python3 -m pip install -r requirements.txt --target build/lambda --platform manylinux2014_x86_64 --implementation cp --python-version 3.12 --only-binary=:all:
          cp -R app build/lambda/app

      - name: Terraform format check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: infra
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && secrets.AWS_PLAN_ROLE_ARN != '')
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform init without backend for pull requests
        working-directory: infra
        if: github.event_name == 'pull_request' && secrets.AWS_PLAN_ROLE_ARN == ''
        run: terraform init -input=false -backend=false

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: infra
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && secrets.AWS_PLAN_ROLE_ARN != '')
        run: terraform plan -input=false -no-color

      # The whole point of planning on a PR: the diff has to be visible in the
      # review, including "the deploy role cannot do this yet".
      - name: Comment the plan on the pull request
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const body = [
              '### Terraform plan',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              (process.env.PLAN || '(no output)').slice(0, 60000),
              '```',
              '',
              '</details>',
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })

  apply:
    name: Terraform apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Build Lambda package
        run: |
          python3 -m pip install --upgrade pip
          # Runtime dependencies only: requirements-dev.txt adds pytest and
          # httpx, which have no place in the Lambda package.
          python3 -m pip install -r requirements.txt --target build/lambda --platform manylinux2014_x86_64 --implementation cp --python-version 3.12 --only-binary=:all:
          cp -R app build/lambda/app

      - name: Terraform init
        working-directory: infra
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve
