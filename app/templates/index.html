<!doctype html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Tee Time Finder</title>
    <style>
        body {
            font: 16px system-ui;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
            color: #18322a
        }

        input,
        button {
            font: inherit;
            padding: 10px;
            margin: 4px 0
        }

        button {
            cursor: pointer
        }

        .card {
            border: 1px solid #ccd8d2;
            border-radius: 8px;
            padding: 14px;
            margin: 10px 0
        }
    </style>
</head>

<body>
    <h1>Tee Time Finder</h1>
    <p>Search local courses by date, time, players, ZIP code, and radius.</p>
    <button id="login">Sign in with Cognito</button>
    <form id="search" hidden><label>Date <input id="date" type="date" required></label>
        <label>ZIP <input id="zip" inputmode="numeric" value="02169" required></label>
        <label>Radius (miles) <input id="radius" type="number" min="1" max="100" step="1" value="25"></label>
        <label>Earliest <input id="earliest" type="time"></label>
        <label>Latest <input id="latest" type="time"></label>
        <label>Players <input id="players" type="number" min="1" max="4" value="2"></label>
        <button>Search tee times</button>
    </form>
    <div id="results"></div>
    <script>
        const base = location.origin; let token = null;
        document.querySelector('#login').onclick = () => { location.href = 'https://tee-time-finder-550968370453.auth.us-east-1.amazoncognito.com/login?client_id=2o1mvf7bfiumaet2rpiubo2js1&response_type=code&scope=openid+email&redirect_uri='+encodeURIComponent(base+'/') };
        const code = new URLSearchParams(location.search).get('code');
        if (code) {
            fetch(
                '/auth/token',
                {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({
                        code,
                        redirect_uri: base + '/'
                    })
                }
            )
                .then(
                    async r => {
                        const x = await r.json();
                        if (!r.ok || !x.access_token) {
                            throw new Error(x.error_description || x.error || 'Token exchange failed');
                            return x
                        }
                    }
               )
                .then(
                    x => {
                        token = x.access_token;
                        document.querySelector('#login').hidden = true;
                        document.querySelector('#search').hidden = false;
                        history.replaceState({}, '', base)
                    }
                )
                .catch(
                    error => {
                        results.textContent = 'Sign-in could not be completed: ' + error.message
                    }
                )
            document.querySelector('#search').onsubmit = async e => {
                e.preventDefault();
                const r = await fetch(
                    '/search',
                    {
                        method: 'POST',
                        headers: {
                            'content-type': 'application/json',
                            'authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify({
                            date: date.value,
                            zip_code: zip.value,
                            radius_miles: +radius.value,
                            earliest_time: earliest.value || null,
                            latest_time: latest.value || null,
                            players: +players.value
                        })
                    });
                results.innerHTML = r.ok ? (await r.json()).map(
                    x => `<div class="card"><b>${x.course_name}</b><br>${x.start_time} · ${x.distance_miles} miles · ${x.players} players</div>`).join('') : 'Search failed.'
            }
        }

    </script>
</body>

</html>
